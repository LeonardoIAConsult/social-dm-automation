name: CI

on:
  push:
    branches: [main]
  pull_request:

# Permisos mínimos: el job solo lee el repo (no escribe, no publica).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # DRY_RUN=true: los tests no necesitan credenciales reales de Meta; env.ts
      # salta la validacion de credenciales en este modo (mismo camino que el
      # desarrollo local sin .env). Sin esto, los modulos que importan env crashean.
      - run: npm test
        env:
          DRY_RUN: 'true'

  # La imagen Docker no la construye nadie mas (Render usa runtime: node), asi que se pudria sin
  # aviso: el 19-oct dejo de construir al sumar el candado de superficie de copia al build. Solo se
  # construye, no se publica.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t inboxpilot-ci .
